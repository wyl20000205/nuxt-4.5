user tengine;
worker_processes auto;
worker_cpu_affinity auto;
worker_rlimit_nofile 200000;

pid /run/tengine.pid;
error_log /var/log/tengine/error.log warn;

events {
    use epoll;
    worker_connections 65535;
    multi_accept on;
}

http {
    include /etc/tengine/mime.types;
    default_type application/octet-stream;

    lua_package_path "/usr/share/tengine/lualib/?.lua;/usr/share/tengine/lualib/?/init.lua;;";
    lua_package_cpath "/usr/lib/tengine/lualib/?.so;;";

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time urt=$upstream_response_time '
                    'ua="$upstream_addr" us="$upstream_status"';

    access_log /var/log/tengine/access.log main;

    server_tokens off;
    variables_hash_max_size 2048;
    variables_hash_bucket_size 128;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 120s;
    keepalive_requests 10000;

    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 60s;
    client_max_body_size 50m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    ssl_session_timeout 5m;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    server {
        listen 80 default_server;
        server_name
            877888.asia
            demo.877888.asia
            test.877888.asia
            jiuyin.877888.asia
            go.877888.asia;

        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl default_server;
        server_name 877888.asia;

        ssl_certificate /home/wyl/www_ssl/877888.asia_bundle.crt;
        ssl_certificate_key /home/wyl/www_ssl/877888.asia.key;

        location = /ws {
            proxy_pass http://8.219.63.91:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            add_header X-WebSocket-Proxy active always;
        }

        location / {
            proxy_pass http://8.219.63.91:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }


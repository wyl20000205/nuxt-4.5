worker_processes  1;

error_log  error.log;
error_log  error.log  notice;
error_log  error.log  info;
#
events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    sendfile        on;
    keepalive_timeout  120;
    gzip  on;

    server {
        listen       80;    
        server_name  877888.asia;
        return 301 https://$host$request_uri;
    }

    server {
        listen       80;
        server_name  demo.877888.asia;
        return 301 https://$host$request_uri;
    }

    server {
        listen       80;
        server_name  test.877888.asia;
        return 301 https://$host$request_uri;
    }

    server {
        listen       80;
        server_name  jiuyin.877888.asia;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name 877888.asia;

        ssl_certificate  /root/wyl/ssl/877888.asia_bundle.crt; 
        ssl_certificate_key /root/wyl/ssl/877888.asia.key; 
        ssl_session_timeout 5m;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        location = /ws {
            proxy_pass http://8.219.63.91:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            add_header X-WebSocket-Proxy active always;
        }

        location / {
            proxy_pass http://8.219.63.91:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

